name: Build applications

on:
  push:
    branches: [main]
    # A version tag also publishes the built applications as a GitHub release.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners use cp1252 for piped output; scripts print Cyrillic.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYQTGRAPH_QT_LIB: PyQt5
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install pinned native LSL library into venv
        run: python scripts/install_lsl.py --allow-base
      - name: Check Python sources
        run: python -m compileall -q app scripts
      - name: Test recording, P300 core and Qt integration
        run: python -m pytest tests -q
      - name: Build application
        run: python scripts/build_app.py
      - name: Check bundled P300 and native LSL
        run: python scripts/check_bundle.py
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Hybrid Interface.app" dist/HybridInterface-macOS.zip
      - name: Upload macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: HybridInterface-macOS
          path: dist/HybridInterface-macOS.zip
          if-no-files-found: error
      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HybridInterface-Windows
          path: dist/HybridInterface.exe
          if-no-files-found: error

  release:
    # Publish even if the macOS leg fails; the Windows build is required.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows application
        uses: actions/download-artifact@v4
        with:
          name: HybridInterface-Windows
          path: release
      - name: Download macOS application
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: HybridInterface-macOS
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "Hybrid Interface $GITHUB_REF_NAME"
          --generate-notes
