name: Build applications

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYQTGRAPH_QT_LIB: PyQt5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check Python sources
        run: python -m compileall -q app scripts
      - name: Test CSV recording
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python scripts/build_app.py
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Hybrid Interface.app" dist/HybridInterface-macOS.zip
      - name: Upload macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: HybridInterface-macOS
          path: dist/HybridInterface-macOS.zip
          if-no-files-found: error
      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HybridInterface-Windows
          path: dist/HybridInterface.exe
          if-no-files-found: error
